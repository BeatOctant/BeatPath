name: test
# Runs on pull requests and on pushes to main: the public copy under BeatOctant takes no pull requests, so a push to
# main is where it is tested there. Documents and probes/ are skipped, and a newer push to the same ref cancels the
# older run.
# The MOD itself (src/OctantPath) is not built here: it needs the game's DLLs.
on:
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "probes/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "probes/**"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Check the OctantSpecs token
        # Only the private repository needs it: the public copy in the BeatOctant organization reads the public repositories
        if: github.repository_owner == 'nejiman10'
        env:
          BEATPATH_CI_READ_BEATDOCS: ${{ secrets.BEATPATH_CI_READ_BEATDOCS }}
        run: |
          if [ -z "$BEATPATH_CI_READ_BEATDOCS" ]; then
            echo "::error title=BEATPATH_CI_READ_BEATDOCS is not set::OctantSpecs is a private repository. Add a fine-grained token with read-only Contents access to nejiman10/OctantSpecs as the repository secret BEATPATH_CI_READ_BEATDOCS (Settings > Secrets and variables > Actions); see README.md, CI."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Fetch OctantSpecs at OCTANTSPECS_REF
        env:
          # git reads OctantSpecs with the token; only this step sees it
          GIT_CONFIG_COUNT: ${{ github.repository_owner == 'nejiman10' && '1' || '0' }}  # no token in the public copy
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.BEATPATH_CI_READ_BEATDOCS }}@github.com/BeatOctant/OctantSpecs.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/BeatOctant/OctantSpecs
        run: bash scripts/fetch-octantspecs.sh
      - run: dotnet test tests/OctantPath.Core.Tests
      - run: dotnet build src/OctantPath.Desktop -c Release
